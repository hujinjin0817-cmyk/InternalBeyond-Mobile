name: Apply Mian patch
on:
  push:
    branches:
      - mian-personal
    paths:
      - .mian/next.patch
      - .github/workflows/mian-sync.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mian-personal
          fetch-depth: 0
      - name: Apply and clean up
        shell: bash
        run: |
          git config user.name "Mian Sync"
          git config user.email "actions@users.noreply.github.com"
          git apply --check .mian/next.patch
          git apply .mian/next.patch
          git add index.html
          git rm .mian/next.patch .github/workflows/mian-sync.yml
          git commit -m "feat: add real sleep tracking to Mian profile"
          git push origin HEAD:mian-personal
