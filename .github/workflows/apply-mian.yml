name: Apply Mian personal build
on:
  push:
    branches: [mian-personal]
    paths: [.mian/ready]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mian-personal
      - name: Apply prepared Mian patch
        shell: bash
        run: |
          cat .mian/patch.part* | base64 -d | gzip -d > /tmp/mian.patch
          git apply --binary /tmp/mian.patch
          rm -rf .mian .github/workflows/apply-mian.yml
          git config user.name "Mian Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: create Mian personal experience"
          git push origin HEAD:mian-personal
