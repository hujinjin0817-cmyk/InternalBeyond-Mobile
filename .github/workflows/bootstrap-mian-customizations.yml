name: Bootstrap Mian customizations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-mian-customizations.yml

permissions:
  contents: write

jobs:
  apply-customizations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the customized branch
        uses: actions/checkout@v4
        with:
          ref: mian-personal
          fetch-depth: 0
      - name: Apply verified customization patch
        shell: bash
        run: |
          set -euo pipefail
          expected="b9b5baaaf7b63b90696f6f8fda01cc477855a6e8"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=Branch changed::Expected $expected but found $actual. Refusing to overwrite."
            exit 1
          fi
