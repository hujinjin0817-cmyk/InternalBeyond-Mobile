PATCH_BASE64
          base64 --decode "$RUNNER_TEMP/mian.patch.b64" > "$RUNNER_TEMP/mian.patch"
          git apply --check "$RUNNER_TEMP/mian.patch"
          git apply --index "$RUNNER_TEMP/mian.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add ChatGPT handoff and encrypted cloud sync"
          git push origin HEAD:mian-personal

  remove-bootstrap:
    needs: apply-customizations
    if: needs.apply-customizations.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Remove one-time delivery workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-mian-customizations.yml
          git commit -m "ci: remove completed Mian bootstrap workflow"
          git push origin HEAD:main
